[package]
name = "rust_api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.11"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
lazy_static = "1.4"
env_logger = "0.11.8"
